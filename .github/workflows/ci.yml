name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race ./...

  # The UI's @oakestra/* dependencies come from GitHub Packages, which needs a token even for
  # public packages. pnpm only reads it from the user npmrc, which setup-node writes.
  ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        working-directory: ui
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@oakestra"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # No build here: the image job runs the same pnpm build.

  image:
    needs: [backend, ui]
    runs-on: ubuntu-latest
    # Only this job pushes, so the others don't get packages: write. On PRs login and push are
    # skipped. Fork PRs only get a read-only token. contents: write is for the release asset.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/oakestra-github-runner
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Addons run on the root orchestrator host, which is often an ARM board, so both
      # architectures are published.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          secrets: node_auth_token=${{ secrets.GITHUB_TOKEN }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Catalogs only accept images pinned by digest, and the digest is only known after the
      # push. So the release carries a definition with this build's digest and version filled in.
      - name: Attach addon definition to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          jq --arg version "${TAG#v}" \
             --arg image "ghcr.io/${{ github.repository_owner }}/oakestra-github-runner@${DIGEST}" \
             '.version = $version | .services[0].image = $image' \
             addon/github-runner.json > github-runner.json
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" github-runner.json --clobber
